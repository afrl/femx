[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "femx"
version = "0.1.0"
description = "Finite element analysis utilities written in JAX."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "fenics-basix",
    "flax",
    "h5py",
    "jax",
    "jaxopt",
    "libigl",
    "matplotlib",
    "meshio",
    "mpi4py",
    "numba",
    "numpy",
    "petsc4py",
    "psutil",
    "scipy",
    "vtk",
]

[project.optional-dependencies]
cuda12 = [
    "jax[cuda12]",
    "cupy-cuda12x",
    "jztree[cuda12]",
]
cuda13 = [
    "jax[cuda13]",
    "cupy-cuda13x",
    "jztree[cuda13]",
]
dev = [
    "pytest",
]
pardiso = [
    "pypardiso",
]
warp = [
    "warp-lang",
]
amgx = [
    "pyamgx",
]
contact = [
    "newton",
    "warp-lang",  
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
norecursedirs = [
    "amgx",
    "exploring_jax",
    "prnn",
    "test_amgx",
    "test_mpi4py_cuda",
    "test_petsc",
]
addopts = [
    "--strict-config",
    "--strict-markers",
]
markers = [
    "truss: truss-element regression and integration tests",
    "pseudotime: pseudotime regression and integration tests",
    "slow: tests that are too expensive for the default fast suite",
]
